name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux/amd64
            package: linux
          - os: windows-2025
            target: windows/amd64
            package: windows
          - os: macos-15-intel
            target: darwin/amd64
            package: macos-intel
          - os: macos-26
            target: darwin/arm64
            package: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Set release version
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          jq --arg version "$APP_VERSION" '.info.productVersion = $version' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build application
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.package }}" == "windows" ]]; then
            wails build -platform "${{ matrix.target }}" -tags webkit2_41 -ldflags "-X main.version=${GITHUB_REF_NAME}" -trimpath -nsis
            cp build/bin/*installer.exe dist/
          else
            wails build -platform "${{ matrix.target }}" -tags webkit2_41 -ldflags "-X main.version=${GITHUB_REF_NAME}" -trimpath
            case "${{ matrix.package }}" in
              linux)
                tar -C build/bin -czf "dist/ytdlp-gui-${GITHUB_REF_NAME}-linux-amd64.tar.gz" ytdlp-gui
                ;;
              macos-intel)
                ditto -c -k --sequesterRsrc --keepParent build/bin/ytdlp-gui.app "dist/ytdlp-gui-${GITHUB_REF_NAME}-macos-amd64.zip"
                ;;
              macos-arm64)
                ditto -c -k --sequesterRsrc --keepParent build/bin/ytdlp-gui.app "dist/ytdlp-gui-${GITHUB_REF_NAME}-macos-arm64.zip"
                ;;
            esac
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=("${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
