version: 2.1

jobs:
  build-linux:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev jq
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
            curl -fsSLO https://go.dev/dl/go1.25.0.linux-amd64.tar.gz
            sudo tar -C /usr/local -xzf go1.25.0.linux-amd64.tar.gz
            echo 'export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH' >> "$BASH_ENV"
      - run:
          name: Install Wails and frontend dependencies
          command: |
            export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
            npm ci --prefix frontend
      - run:
          name: Build Linux package
          command: |
            export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
            VERSION="${CIRCLE_TAG#v}"
            jq --arg version "$VERSION" '.info.productVersion = $version' wails.json > wails.json.tmp
            mv wails.json.tmp wails.json
            wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.version=${CIRCLE_TAG}" -trimpath
            mkdir -p dist-linux
            tar -C build/bin -czf "dist-linux/ytdlp-gui-${CIRCLE_TAG}-linux-amd64.tar.gz" ytdlp-gui
      - persist_to_workspace:
          root: .
          paths:
            - dist-linux

  build-windows:
    working_directory: 'C:\Users\circleci\project'
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Install build tools
          command: |
            choco install golang --version=1.25.0 --yes --no-progress
            choco install nodejs-lts mingw nsis --yes --no-progress
      - run:
          name: Install Wails and frontend dependencies
          command: |
            $env:Path += ";$env:USERPROFILE\go\bin"
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
            npm ci --prefix frontend
      - run:
          name: Build Windows installer
          command: |
            $env:Path += ";$env:USERPROFILE\go\bin"
            $makensisPath = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
            if (-not $makensisPath) {
              $makensisPath = (Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS', "$env:ChocolateyInstall\lib\nsis\tools" -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            }
            if (-not $makensisPath) { throw 'NSIS makensis.exe was not found after installation.' }
            $env:Path += ";$(Split-Path $makensisPath)"
            & $makensisPath -VERSION
            $config = Get-Content wails.json -Raw | ConvertFrom-Json
            if ($env:CIRCLE_TAG -notmatch '^v?(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:-(?<prerelease>[0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$') {
              throw "Tag '$env:CIRCLE_TAG' is not a valid application version."
            }
            $major = $Matches['major']
            $minor = $Matches['minor']
            $patch = $Matches['patch']
            $prerelease = $Matches['prerelease']
            $build = 0
            if ($prerelease -match '(\d+)$') { $build = [int]$Matches[1] }
            $config.info.productVersion = "$major.$minor.$patch.$build"
            $json = $config | ConvertTo-Json -Depth 100
            [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'wails.json'), $json, (New-Object System.Text.UTF8Encoding $false))
            wails build -platform windows/amd64 -tags webkit2_41 -ldflags "-X main.version=$env:CIRCLE_TAG" -trimpath -nsis
            New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
            $installer = Get-ChildItem build/bin -Filter '*installer.exe' -File | Select-Object -First 1
            if (-not $installer) { throw 'Windows installer was not produced in build/bin.' }
            Copy-Item $installer.FullName dist-windows/
            Get-ChildItem dist-windows
      - persist_to_workspace:
          root: 'C:\Users\circleci\project'
          paths:
            - dist-windows

  build-macos:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Install Go, Node, and Wails
          command: |
            brew install node@22 jq
            curl -fsSLO https://go.dev/dl/go1.25.0.darwin-arm64.tar.gz
            mkdir -p "$HOME/.local"
            tar -C "$HOME/.local" -xzf go1.25.0.darwin-arm64.tar.gz
            echo 'export PATH="$HOME/.local/go/bin:$(brew --prefix node@22)/bin:$HOME/go/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.local/go/bin:$(brew --prefix node@22)/bin:$HOME/go/bin:$PATH"
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
            npm ci --prefix frontend
      - run:
          name: Build universal macOS app
          command: |
            export PATH="$HOME/.local/go/bin:$(brew --prefix node@22)/bin:$HOME/go/bin:$PATH"
            VERSION="${CIRCLE_TAG#v}"
            jq --arg version "$VERSION" '.info.productVersion = $version' wails.json > wails.json.tmp
            mv wails.json.tmp wails.json
            wails build -platform darwin/universal -ldflags "-X main.version=${CIRCLE_TAG}" -trimpath
            mkdir -p dist-macos
            ditto -c -k --sequesterRsrc --keepParent build/bin/ytdlp-gui.app "dist-macos/ytdlp-gui-${CIRCLE_TAG}-macos-universal.zip"
      - persist_to_workspace:
          root: .
          paths:
            - dist-macos

  publish-release:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install GitHub CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y gh
      - run:
          name: Verify release assets
          command: |
            for directory in dist-linux dist-windows dist-macos; do
              if [[ ! -d "$directory" ]]; then
                echo "Missing release asset directory: $directory"
                find . -maxdepth 3 -type f -print
                exit 1
              fi
              if [[ -z "$(find "$directory" -maxdepth 1 -type f -print -quit)" ]]; then
                echo "No release files found in: $directory"
                exit 1
              fi
            done
      - run:
          name: Publish GitHub release
          command: |
            args=("$CIRCLE_TAG" dist-linux/* dist-windows/* dist-macos/* \
              --repo azrilpramudia/yt-dlp-gui \
              --title "$CIRCLE_TAG" \
              --generate-notes)
            if [[ "$CIRCLE_TAG" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"

workflows:
  build-and-release:
    jobs:
      - build-linux:
          filters: &release-tag-filter
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - build-windows:
          filters: *release-tag-filter
      - build-macos:
          filters: *release-tag-filter
      - publish-release:
          requires:
            - build-linux
            - build-windows
            - build-macos
          filters: *release-tag-filter
